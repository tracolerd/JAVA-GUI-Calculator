<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">Java GUI Calculator — project banner</title><desc id="desc">A Java Swing interface with keyboard input, live expression preview and recursive-descent evaluation without eval-style shortcuts.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0D1A"/><stop offset=".58" stop-color="#211843"/><stop offset="1" stop-color="#0B1220"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><radialGradient id="glow"><stop stop-color="#C4B5FD" stop-opacity=".27"/><stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C9D5E7" stroke-opacity=".07"/></pattern><style>@keyframes pulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1400px)}}.pulse{animation:pulse 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style></defs><rect width="1280" height="420" rx="28" fill="url(#bg)"/><rect width="1280" height="420" rx="28" fill="url(#grid)"/><ellipse cx="1010" cy="190" rx="310" ry="250" fill="url(#glow)"/><path d="M0 330C220 250 400 410 650 323S1030 283 1280 330" fill="none" stroke="#C4B5FD" stroke-opacity=".13" stroke-width="2"/><g font-family="Segoe UI,Inter,Arial,sans-serif"><text x="70" y="70" fill="#C4B5FD" font-size="14" font-weight="700" letter-spacing="3.4">DESKTOP APPLICATION  /  JAVA SWING</text><text x="68" y="145" fill="#F8FAFC" font-size="46" font-weight="760" letter-spacing="-1.1">Java GUI Calculator</text><text x="72" y="194" fill="#CAD5E3" font-size="18">A Java Swing interface